# Equivalente en Docker Compose (comparación con Terraform / alternativa de laboratorio)
# Uso: docker compose -f docker/docker-compose.yml up -d
name: lab-compose

services:
  db:
    image: postgres:16-alpine
    container_name: lab-compose-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: LabPassword123
    networks:
      lab-net:
        ipv4_address: 10.10.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: python:3.12-alpine
    container_name: lab-compose-app
    command: python -m http.server 8080 --directory /tmp
    networks:
      lab-net:
        ipv4_address: 10.10.0.20
    depends_on:
      - db

  web:
    image: nginx:1.27-alpine
    container_name: lab-compose-web
    ports:
      - "8081:80"
    networks:
      lab-net:
        ipv4_address: 10.10.0.10
    depends_on:
      - app

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1
